<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora</title>
    </head>
    <body>
        <h1>Esse site é uma calculadora</h1>
        <form>
            <label for=num1>Digite o primeiro número</label><br>
            <input type="number" id="num1" placeholder="Ex:5">
            <br><br>
            <label for=num2>Digite o segundo número</label><br>
            <input type="number" id="num2" placeholder="Ex:47"><br>
            
            <br><button type="button" onclick="calcular('1')" id="S1">Soma</button><br>
            <br><button type="button" onclick="calcular('2')" id="S2">Subtração</button><br>
            <br><button type="button" onclick="calcular('3')" id="D">Divisão</button><br>
            <br><button type="button" onclick="calcular('4')" id="M1">Multiplicação</button><br>
            <br><button type="button" onclick="calcular('5')" id="M2">Mod</button><br>

            <p id ="res">Resposta:</p>
            <script>
                function calcular(operação){


                    let  num1 = parseFloat(document.getElementById("num1").value);
                    let num2 = parseFloat(document.getElementById("num2").value);
                    let res;

                    switch(operação)
                     { 
                        case '1': res = num1 + num2;
                            break;
                            
                        case '2': res = num1 - num2;
                            break;
                        
                        case '3': res = num1 / num2;
                            break;

                        case '4': res = num1 * num2;
                            break;

                        case '5': res = num1 % num2;
                            break;

                            default: res = "Operação inválida"
                            break;
                    }

                    document.getElementById("res").textContent = "Resposta: " + res;
                    
                }
            </script>

        </form>
       
    </body>
</html>
